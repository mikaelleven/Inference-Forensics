# Sample combined benchmark configuration.
# Paths are relative to this TOML file.

runs = 3
warmup = 1
max_thinking = "off"
temperature = 0
prompt_file = "prompt.md"
payload_file = "payload.txt"
output_dir = "../data"
name = "sample-models"

# Compact alternative when no per-model overrides are needed:
# models = ["phi4-mini:latest", "qwen3.5:4b"]
# Use either the compact form above or the full table form below.

# Add or remove model entries as needed for the Ollama installation.
[[models]]
model = "phi4-mini:latest"

[[models]]
model = "qwen3.5:4b"
# max_thinking = "on"  # Optional per-model override.
