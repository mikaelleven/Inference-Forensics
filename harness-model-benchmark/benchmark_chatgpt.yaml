version: 1

benchmark:
  name: harness-model-benchmark-chatgpt
  runs: 1
  warmup_runs: 0
  timeout_seconds: 300
  output_dir: null               # null => ./results/<UTC timestamp>/
  system_prompt_file: benchmark-system-prompt.md

fixtures:
  - id: 00-validate

models:
  - name: "pi: Luna [None]"
    harness: pi
    provider: openai-codex
    model: gpt-5.6-luna
    reasoning: none

  - name: "pi: Luna [Low]"
    harness: pi
    provider: openai-codex
    model: gpt-5.6-luna
    reasoning: low

  - name: "pi: Luna [High]"
    harness: pi
    provider: openai-codex
    model: gpt-5.6-luna
    reasoning: high

  - name: "pi: Terra [None]"
    harness: pi
    provider: openai-codex
    model: gpt-5.6-terra
    reasoning: none

  - name: "pi: Terra [Low]"
    harness: pi
    provider: openai-codex
    model: gpt-5.6-terra
    reasoning: low

  - name: "pi: Terra [High]"
    harness: pi
    provider: openai-codex
    model: gpt-5.6-terra
    reasoning: high

  - name: "codex: Luna [None]"
    harness: codex
    model: gpt-5.6-luna
    reasoning: none
    sandbox: workspace-write
    approve_for_me: true

  - name: "codex: Luna [Low]"
    harness: codex
    model: gpt-5.6-luna
    reasoning: low
    sandbox: workspace-write
    approve_for_me: true

  - name: "codex: Luna [High]"
    harness: codex
    model: gpt-5.6-luna
    reasoning: high
    sandbox: workspace-write
    approve_for_me: true

  - name: "codex: Terra [None]"
    harness: codex
    model: gpt-5.6-terra
    reasoning: none
    sandbox: workspace-write
    approve_for_me: true

  - name: "codex: Terra [Low]"
    harness: codex
    model: gpt-5.6-terra
    reasoning: low
    sandbox: workspace-write
    approve_for_me: true

  - name: "codex: Terra [High]"
    harness: codex
    model: gpt-5.6-terra
    reasoning: high
    sandbox: workspace-write
    approve_for_me: true
